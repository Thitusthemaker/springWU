<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="css/style1.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Galindo&display=swap');
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />

</head>
<body id="cartPageBody">
    <nav>
        <img id="logo" src="img/loga.png" alt="">

        <section id="container">
        <a href="">Our Stores!</a>
        <a href="">Contact Us!</a>
        <a href="">Why us?</a>
        <a href="">Deals!</a>
        </section>

        <input id="search" type="search" placeholder="Search products">
        <div id="selectable">
        <a id="cart" href="cart.html">
            <img  src="img/cart.png" alt="Cart">
        </a>
        </div>
        
    </nav>
    <section id="banner"></section>
    <main id="list">
        <h3 class="prname title" id="yourCart">Your cart (5)</h3>
        <article class="cartProduct">
            <img class="display" src="img/vattenpass/vpass-1.jpg" alt="">
            <h1 class="prname">Vattenpass</h1>
            <div class="stars" alt="${stars} out of 5">
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <h6 class="ratings">(6)</h6>
            </div>
            <h6 class="credit">Author ASdasga agsdasdg</h6>
            <h2 class="price">999.-</h2>
            <div class="removeFromCart" data-id="${id}">
                <img class="removeCart" src="img/trash.png" alt="Remove from cart">
                
            </div>
        `
        </article>
        <article class="cartProduct">
            <img class="display" src="img/vattenpass/vpass-1.jpg" alt="">
            <h1 class="prname">Vattenpass</h1>
            <div class="stars" alt="${stars} out of 5">
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <img class="fullstar" src="img/star.png"></img>
                <h6 class="ratings">(6)</h6>
            </div>
            <h6 class="credit">Author ASdasga agsdasdg</h6>
            <h2 class="price">999.-</h2>
            <div class="removeFromCart" data-id="${id}">
                <img class="removeCart" src="img/trash.png" alt="Remove from cart">
                
            </div>
        `
        </article>
    </main>
    <aside id="summary">
        <h3 class="title" id="ordertit">Order summary</h3>
        <h4 class="small">Subtotal (5 items)</h4>
        <h3 class="num">9999.-</h3>
        <h4 class="small">Shipping </h4>
        <h3 class="num">0.-</h3>
        <h4 class="small">Tax (10%) </h4>
        <h3 class="num">999.-</h3>
        <div class="divider"></div>
    </aside>
    <script src="js/script2.js"></script>
</body>
</html>
