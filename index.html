<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Test1</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Galindo&display=swap');
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
</head>
<body>


  <!-- Fluorsdörss Floors & Doors -->
  <!-- Tangentens lutning (vattenpass) -->
  <nav>

    <img id="logo" src="img/loga.png" alt="">
    <div id="selectable">
      <img id="cart" src="img/cart.png" alt="">
      <img id="menu-button" src="img/menu.png" alt="">
    </div>
    
  </nav>

  <section>
    <div id="container">
      <button type="button"><b>Our Shops</b></button>
      <button type="button">Button2</button>
      <button type="button">Button3</button>
      <button type="button">Button4</button>
    </div>
  </section>

  <aside>
    <h2 class="galindo-regular" id="filter">Filters</h2>

    <h3 class="filters" id="stars">Minimum stars: 0</h3>
    <div class="slidecontainer">
      <input type="range" min="0" max="5" step="0.5" value="0" class="slider" id="starsSlider">
    </div>

    <h3 class="filters" id="minPrice">Minium price: 50kr</h3>
    <div class="slidecontainer">
      <input type="range" min="100" max="10000" step="100" value="50" class="slider" id="minPriceSlider">
    </div>

    <h3 class="filters" id="maxPrice">Maximum price: 50kr</h3>
    <div class="slidecontainer">
      <input type="range" min="100" max="10000" step="100" value="50" class="slider" id="maxPriceSlider">
    </div>
    
    <h3 class="filters" id="maxWidth">MaxWidth: 50cm</h3>
    <div class="slidecontainer">
      <input type="range" min="1" max="100" step="1" value="50" class="slider" id="maxWidthSlider">
    </div>

    <h3 class="filters" id="maxLength">MaxLength: 50cm</h3>
    <div class="slidecontainer">
      <input type="range" min="1" max="100" step="1" value="50" class="slider" id="maxLengthSlider">
    </div>
    
  </aside>
  <div id="menu">
    <img id="close-menu" src="img/close.png" alt="">

  </div>  

  <main id="main">
  </main>

  <footer></footer>
  <script src="js/javascript.js"></script> 
</body>
</html>
